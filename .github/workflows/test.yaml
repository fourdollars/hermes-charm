name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Lint shell scripts
        run: |
          find hooks actions -type f -executable -exec shellcheck -x {} +

      - name: Validate YAML files
        run: |
          python3 -c "import yaml; yaml.safe_load(open('metadata.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('config.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('actions.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('charmcraft.yaml'))"

      - name: Check hook permissions
        run: |
          for hook in hooks/*; do
            if [ -f "$hook" ] && [ ! -x "$hook" ]; then
              echo "ERROR: $hook is not executable"
              exit 1
            fi
          done

      - name: Check action permissions
        run: |
          for action in actions/*; do
            if [ -f "$action" ] && [ ! -x "$action" ]; then
              echo "ERROR: $action is not executable"
              exit 1
            fi
          done

      - name: Run validate.sh
        run: ./validate.sh

      - name: Integration test install-pkgs packages
        run: |
          sudo useradd -m -s /bin/bash ubuntu 2>/dev/null || true
          sudo bash -c '
            set -euo pipefail
            juju-log(){ echo "juju-log: $*"; }
            source hooks/common.sh
            install_extra_pkgs "tailscale,homebrew"
            command -v tailscale
            tailscale version | head -n1
            command -v brew
            brew --version | head -n1
            test -x /home/linuxbrew/.linuxbrew/bin/brew
            grep -F "linuxbrew" /home/ubuntu/.profile
          '

  pack:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: charmcraft pack --destructive-mode

      - name: Upload charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: hermes-charm
          path: "*.charm"
          retention-days: 30
